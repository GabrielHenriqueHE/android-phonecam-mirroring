[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonecam"
dynamic = ["version"]
description = "Usa a câmera do celular Android como webcam no Linux (v4l2loopback)"
requires-python = ">=3.10"
dependencies = [
    "av>=12",
    "numpy>=1.24",
    "pyvirtualcam>=0.11",
    "zeroconf>=0.130",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phonecam = "phonecam.cli:main"

[tool.setuptools.dynamic]
version = { attr = "phonecam.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
